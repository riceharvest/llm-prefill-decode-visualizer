  <body>
    <!-- Server-rendered summary: visible to agents/crawlers without JS.
         Hidden visually but present in raw HTML (agent readiness #1). -->
    <noscript>
      <h1>LLM Prefill &amp; Decode Speed Visualizer</h1>
      <p>
        An interactive simulator and JSON API for LLM inference performance.
        Prefill is the compute-bound pass that ingests your entire prompt in
        parallel and determines time-to-first-token (TTFT). Decode is the
        bandwidth-bound pass that generates one token at a time and determines
        time-per-output-token (TPOT). This tool lets you compare both phases
        across consumer GPUs, Apple Silicon and cloud endpoints, and reason
        about KV-cache VRAM growth, prefix caching savings, speculative
        decoding speedups, continuous batching throughput, engine launch-flag
        effects and dollar cost per million tokens.
      </p>
      <h2>Use it without a browser</h2>
      <p>
        Every calculation on the page is available as plain JSON over HTTP —
        no JavaScript required. The OpenAPI spec lives at /api/spec and lists
        every endpoint. Start with:
      </p>
      <ul>
        <li>/api/compute?model=singleTurn&amp;promptTokens=4096&amp;outputTokens=512&amp;prefillSpeed=3800&amp;decodeSpeed=105 — TTFT, TPOT and total walltime</li>
        <li>/api/vram?hfId=meta-llama/Llama-3.1-8B-Instruct&amp;context=65536 — VRAM needed for a model at a given context</li>
        <li>/api/presets — measured hardware presets (tok/s prefill and decode)</li>
        <li>/api/benchmarks — live community benchmark runs with confidence intervals</li>
      </ul>
      <p>
        Send <code>Accept: text/markdown</code> to get responses as markdown
        instead of JSON. Machine-readable agent guidance lives at
        <a href="/llms.txt">/llms.txt</a>. The full API reference is at
        <a href="/api/spec">/api/spec</a>. Privacy policy:
        <a href="/privacy.html">/privacy.html</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
