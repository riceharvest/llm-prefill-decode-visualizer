<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status — LLM Prefill &amp; Decode Speed Visualizer</title>
<meta name="description" content="Live service status for the LLM Prefill &amp; Decode Speed Visualizer: API availability, upstream benchmark-data freshness, last sync time and cache age. Machine-readable equivalent: /api/health.">
<!-- Utility page: keep out of search indexes. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://llm-prefill-decode-visualizer.vercel.app/status.html">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Status — LLM Prefill & Decode Speed Visualizer",
  "url": "https://llm-prefill-decode-visualizer.vercel.app/status.html",
  "description": "Live service status: API availability, upstream data freshness and cache age. Auto-refreshes every 60 seconds. Machine-readable equivalent: /api/health.",
  "mainEntity": {
    "@type": "WebAPI",
    "name": "Health API",
    "url": "https://llm-prefill-decode-visualizer.vercel.app/api/health"
  }
}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --muted: #8b949e;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 20px; margin: 0 0 24px; font-weight: 600; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 24px; margin-bottom: 16px;
  }
  .status-line { display: flex; align-items: center; gap: 12px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 12px var(--bad); }
  #headline { font-size: 18px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  td { padding: 6px 0; vertical-align: top; }
  td:first-child { color: var(--muted); width: 45%; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
  .refreshing { opacity: 0.6; transition: opacity 0.2s; }
</style>
</head>
<body>
<main>
  <h1>LLM Prefill &amp; Decode Speed Visualizer — Status</h1>

  <div class="card">
    <div class="status-line">
      <span id="dot" class="dot"></span>
      <span id="headline">Checking…</span>
    </div>
  </div>

  <div class="card" id="details-card">
    <table>
      <tr><td>API service</td><td id="api-status">—</td></tr>
      <tr><td>Upstream data</td><td id="freshness">—</td></tr>
      <tr><td>Last successful sync</td><td id="last-sync">—</td></tr>
      <tr><td>Cache age</td><td id="cache-age">—</td></tr>
      <tr><td>Cached benchmark runs</td><td id="row-count">—</td></tr>
      <tr><td>Checked at</td><td id="checked-at">—</td></tr>
    </table>
  </div>

  <noscript>
    <div class="card">
      <p>This page needs JavaScript to render live values. Machine-readable status:</p>
      <ul>
        <li><a href="/api/health"><code>/api/health</code></a> — availability, upstream freshness, cache age</li>
        <li><a href="/api/agent/freshness.json"><code>/api/agent/freshness.json</code></a> — per-group freshness/confidence report</li>
      </ul>
    </div>
  </noscript>

  <footer>
    Auto-refreshes every 60s ·
    Data source: <a href="https://www.localmaxxing.com" rel="noopener">localmaxxing.com</a> ·
    Machine-readable endpoint: <a href="/api/health"><code>/api/health</code></a> ·
    Freshness report: <a href="/api/agent/freshness.json"><code>/api/agent/freshness.json</code></a>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var REFRESH_MS = 60000;
  // Last-known-good health payload, retained so a transient failed poll
  // never erases the last successful sync values (#918).
  var lastGood = null;

  function el(id) { return document.getElementById(id); }

  function fmtAge(seconds) {
    if (seconds == null) return '—';
    if (seconds < 60) return seconds + 's';
    var m = Math.floor(seconds / 60);
    if (m < 60) return m + 'm ' + (seconds % 60) + 's';
    var h = Math.floor(m / 60);
    return h + 'h ' + (m % 60) + 'm';
  }

  // Locale-INDEPENDENT formatting (issue #663): this page is advertised to
  // agents (llms.txt) as well as humans, so every timestamp renders as a
  // UTC ISO-8601 string (kept machine-parseable in the <time datetime> /
  // data-iso attribute too) instead of the visitor-locale locale-formatted
  // string, whose output flips with the visitor's OS locale ("24.8.2026,
  // "8/24/2026, 9:38:00 PM"). Counts render ungrouped via String(n).
  function setIsoTime(id, iso) {
    var node = el(id);
    if (!iso) { node.textContent = 'never'; return; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { node.textContent = iso; return; }
    var text = d.toISOString();
    // Machine-readable ISO kept on a <time> element when the DOM supports
    // element creation; minimal test/mock DOMs get plain ISO text.
    if (typeof document.createElement === 'function' && node.appendChild) {
      while (node.firstChild) node.removeChild(node.firstChild);
      var t = document.createElement('time');
      t.setAttribute('datetime', text);
      t.setAttribute('data-iso', text);
      t.textContent = text;
      node.appendChild(t);
    } else {
      node.textContent = text;
    }
  }

  function setState(dotClass, headline) {
    el('dot').className = 'dot ' + dotClass;
    el('headline').textContent = headline;
  }

  function render(data) {
    var f = data.upstreamFreshness || {};
    el('api-status').innerHTML = data.ok ? '<span style="color:var(--ok)">Operational</span>' : '<span style="color:var(--bad)">Error</span>';

    var freshLabel = { fresh: ['var(--ok)', 'Fresh'], stale: ['var(--warn)', 'Stale (serving cached data)'], empty: ['var(--warn)', 'No data yet'] };
    var fl = freshLabel[f.status] || freshLabel.empty;
    el('freshness').innerHTML = '<span style="color:' + fl[0] + '">' + fl[1] + '</span>';

    setIsoTime('last-sync', f.fetchedAt);
    el('cache-age').textContent = f.ageSeconds != null ? fmtAge(f.ageSeconds) + ' ago' : '—';
    el('row-count').textContent = f.rowCount != null ? String(f.rowCount) : '—';
    setIsoTime('checked-at', data.time);

    if (!data.ok) setState('bad', 'API error');
    else if (f.status === 'stale') setState('warn', 'Degraded — upstream data is stale');
    else if (f.status === 'empty') setState('warn', 'Starting up — no upstream data yet');
    else setState('ok', 'All systems operational');
  }

  // API responded with a non-2xx status. Show the failure as an API error —
  // NOT as upstream "No data yet" cold start — and keep last-known-good
  // freshness/sync values in place rather than rewriting them (#918).
  function renderApiError(status) {
    el('api-status').innerHTML = '<span style="color:var(--bad)">Error' + (status != null ? ' (HTTP ' + status + ')' : '') + '</span>';
    el('freshness').innerHTML = '<span style="color:var(--bad)">Unknown — API error</span>';

    var f = (lastGood && lastGood.upstreamFreshness) || {};
    // First-poll failure (no last-known-good yet): '—', never a false "never
    // synced" (#918).
    if (f.fetchedAt) setIsoTime('last-sync', f.fetchedAt);
    else el('last-sync').textContent = '—';
    el('cache-age').textContent = f.ageSeconds != null ? fmtAge(f.ageSeconds) + ' ago' : '—';
    el('row-count').textContent = f.rowCount != null ? String(f.rowCount) : '—';
    el('checked-at').textContent = new Date().toISOString();

    setState('bad', 'API error');
  }

  function check() {
    document.body.classList.add('refreshing');
    fetch('/api/health', { cache: 'no-store' })
      .then(function (r) {
        // Read as text and parse defensively: WAF/challenge layers may answer
        // with HTML, which must surface as an API error, not as
        // "unreachable" (#918 mode 3).
        return r.text().then(function (t) {
          var body = null;
          try { body = JSON.parse(t); } catch (e) {}
          return { ok: r.ok, status: r.status, body: body };
        });
      })
      .then(function (r) {
        if (r.ok && r.body) { lastGood = r.body; render(r.body); }
        else renderApiError(r.ok ? null : r.status);
      })
      .catch(function () {
        // Network-level failure: keep every detail row at its last-known-good
        // value, only flag the headline + API row (#918 mode 2).
        el('api-status').innerHTML = '<span style="color:var(--bad)">Unreachable</span>';
        setState('bad', 'Unreachable — could not reach the API');
        el('checked-at').textContent = new Date().toISOString();
      })
      .finally(function () { document.body.classList.remove('refreshing'); });
  }

  check();
  setInterval(check, REFRESH_MS);
})();
</script>
</body>
</html>
