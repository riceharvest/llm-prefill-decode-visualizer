name: CI

# Gate for every push/PR: unit tests, lint, and a production build must
# all pass before a change can merge to main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: node --test "**/*.test.js"

      - name: Lint
        run: npx oxlint

      - name: Build
        run: npx vite build
