[tool.poetry]
name = "llm-prefill-decode-speed-visualizer-api-client"
version = "2.6.0"
description = "A client library for accessing LLM Prefill & Decode Speed Visualizer API"
authors = []
readme = "README.md"
packages = [
    { include = "llm_prefill_decode_speed_visualizer_api_client" },
]
include = ["llm_prefill_decode_speed_visualizer_api_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.23.1,<0.29.0"
attrs = ">=22.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
